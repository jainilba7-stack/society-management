<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resident Portal - SocietyOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Razorpay SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex">

  <div id="sidebar-container"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <div id="navbar-container"></div>

    <main class="p-6 md:p-8 space-y-8 max-w-7xl mx-auto w-full">
      <!-- Welcome Header -->
      <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-100 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
          <span class="text-xs font-extrabold text-cyan-600 uppercase tracking-wider bg-cyan-50 px-3 py-1 rounded-full">Resident Portal</span>
          <h2 id="res-welcome" class="text-2xl font-extrabold text-slate-900 mt-1">Welcome, Resident 👋</h2>
          <p class="text-xs sm:text-sm text-slate-500">
            Block: <strong id="res-block-name" class="text-slate-800">A</strong> | Flat: <strong id="res-flat-number" class="text-slate-800">A-101</strong>
          </p>
        </div>
        <div class="flex gap-2">
          <a href="complaints.html" class="btn-aqua-outline text-xs py-2.5 px-4 flex items-center">
            <i class="lucide-alert-circle text-sm mr-1.5"></i> File Complaint
          </a>
        </div>
      </div>

      <!-- Current Bills Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Current Maintenance Bill Card -->
        <div id="res-bill-card" class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-100 shadow-sm space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="font-extrabold text-slate-900 text-lg">Maintenance Bill</h3>
            <span id="res-bill-status"></span>
          </div>

          <div class="grid grid-cols-3 gap-3 bg-slate-50 p-4 rounded-2xl">
            <div>
              <p class="text-[11px] font-semibold text-slate-400">Month</p>
              <p id="res-bill-month" class="text-sm font-bold text-slate-800">No Active Bill</p>
            </div>
            <div>
              <p class="text-[11px] font-semibold text-slate-400">Amount Due</p>
              <p id="res-bill-amount" class="text-base font-extrabold text-slate-900">₹0</p>
            </div>
            <div>
              <p class="text-[11px] font-semibold text-slate-400">Due Date</p>
              <p id="res-bill-duedate" class="text-xs font-bold text-slate-800">-</p>
            </div>
          </div>

          <div id="res-bill-action" class="pt-2 flex justify-between items-center">
            <div id="res-bill-proof-wrapper"></div>
            <div id="res-bill-btn-wrapper"></div>
          </div>
        </div>

        <!-- Electricity Bill Card -->
        <div id="res-elec-card" class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-100 shadow-sm space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="font-extrabold text-slate-900 text-lg">Flat Electricity Bill</h3>
            <span id="res-elec-status"></span>
          </div>

          <div class="grid grid-cols-3 gap-3 bg-slate-50 p-4 rounded-2xl">
            <div>
              <p class="text-[11px] font-semibold text-slate-400">Month</p>
              <p id="res-elec-month" class="text-sm font-bold text-slate-800">No Bill Issued</p>
            </div>
            <div>
              <p class="text-[11px] font-semibold text-slate-400">Units & Meter</p>
              <p id="res-elec-units" class="text-xs font-bold text-slate-800">0 kWh</p>
            </div>
            <div>
              <p class="text-[11px] font-semibold text-slate-400">Amount</p>
              <p id="res-elec-amount" class="text-base font-extrabold text-slate-900">₹0</p>
            </div>
          </div>

          <div id="res-elec-action" class="pt-2 flex justify-between items-center">
            <div id="res-elec-proof-wrapper"></div>
            <a href="electricity.html" class="btn-aqua-outline text-xs px-4 py-2 flex items-center">
              <i class="lucide-zap text-xs mr-1"></i> Electricity History
            </a>
          </div>
        </div>
      </div>

      <!-- Section Grids -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Announcements -->
        <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="font-extrabold text-slate-900 text-base">Announcements</h3>
            <a href="announcements.html" class="text-xs text-cyan-600 font-bold hover:underline">View Board</a>
          </div>
          <div id="res-announcements-list" class="space-y-3"></div>
        </div>

        <!-- My Complaints -->
        <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="font-extrabold text-slate-900 text-base">My Complaints</h3>
            <a href="complaints.html" class="text-xs text-cyan-600 font-bold hover:underline">File New</a>
          </div>
          <div id="res-complaints-list" class="space-y-3"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/maintenance.js"></script>
  <script>
    lucide.createIcons();
    const user = auth.checkAuth(['resident']);

    if (user) {
      document.getElementById('res-welcome').innerText = `Welcome, ${user.fullName}`;
      document.getElementById('res-block-name').innerText = user.blockName || 'Assigned Block';
      document.getElementById('res-flat-number').innerText = user.flatNumber || 'My Flat';

      ui.initLayout('resident-dashboard.html');
      loadResidentData();
    }

    async function loadResidentData() {
      try {
        // Load Maintenance Payments
        const pData = await api.get('/maintenance/payments');
        if (pData.success && pData.payments.length > 0) {
          const currentP = pData.payments[0];
          document.getElementById('res-bill-month').innerText = currentP.bill ? `${currentP.bill.month} ${currentP.bill.year}` : 'Active Maintenance';
          document.getElementById('res-bill-amount').innerText = ui.formatCurrency(currentP.totalPaid);
          document.getElementById('res-bill-duedate').innerText = currentP.bill ? ui.formatDate(currentP.bill.dueDate) : '-';
          document.getElementById('res-bill-status').innerHTML = ui.getStatusBadge(currentP.status);

          const proofDiv = document.getElementById('res-bill-proof-wrapper');
          if (currentP.bill && currentP.bill.billImageUrl) {
            proofDiv.innerHTML = `
              <button onclick="ui.showImageModal('${currentP.bill.billImageUrl}', 'Maintenance Bill Proof')" class="btn-aqua-outline text-xs px-3 py-1.5 flex items-center">
                <i class="lucide-image text-xs mr-1"></i> Bill Proof Photo
              </button>
            `;
          }

          const btnDiv = document.getElementById('res-bill-btn-wrapper');
          if (currentP.status === 'pending') {
            btnDiv.innerHTML = `
              <button onclick="maintenanceModule.payOnline('${currentP._id}', ${currentP.totalPaid})" class="btn-aqua text-xs px-4 py-2 flex items-center">
                <i class="lucide-credit-card text-xs mr-1.5"></i> Pay Now Online
              </button>
            `;
          } else {
            btnDiv.innerHTML = `
              <button onclick="maintenanceModule.downloadReceipt('${currentP._id}')" class="btn-aqua-outline text-xs px-4 py-2 flex items-center">
                <i class="lucide-download text-xs mr-1.5"></i> Receipt
              </button>
            `;
          }
        }

        // Load Electricity Bills for Resident Flat
        const eData = await api.get('/electricity');
        if (eData.success && eData.bills.length > 0) {
          const latestElec = eData.bills[0];
          document.getElementById('res-elec-month').innerText = `${latestElec.month} ${latestElec.year}`;
          document.getElementById('res-elec-units').innerHTML = `${latestElec.unitsConsumed || 0} kWh <span class="block text-[10px] text-slate-400 font-normal">${latestElec.meterReading ? `Reading: ${latestElec.meterReading}` : ''}</span>`;
          document.getElementById('res-elec-amount').innerText = ui.formatCurrency(latestElec.amount);
          document.getElementById('res-elec-status').innerHTML = ui.getStatusBadge(latestElec.status);

          const elecProofDiv = document.getElementById('res-elec-proof-wrapper');
          if (latestElec.billImageUrl) {
            elecProofDiv.innerHTML = `
              <button onclick="ui.showImageModal('${latestElec.billImageUrl}', 'Flat Electricity Meter Photo')" class="btn-aqua-outline text-xs px-3 py-1.5 flex items-center">
                <i class="lucide-image text-xs mr-1"></i> Meter Photo
              </button>
            `;
          }
        }

        // Load Announcements
        const aData = await api.get('/announcements');
        if (aData.success) {
          const list = document.getElementById('res-announcements-list');
          if (aData.announcements.length === 0) {
            list.innerHTML = `<div class="text-slate-400 text-xs py-4 text-center">No announcements</div>`;
          } else {
            list.innerHTML = aData.announcements.slice(0, 3).map(a => `
              <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs">
                <div class="font-bold text-slate-900">${a.title}</div>
                <p class="text-slate-600 mt-1">${a.description.substring(0, 100)}...</p>
              </div>
            `).join('');
          }
        }

        // Load Complaints
        const cData = await api.get('/complaints');
        if (cData.success) {
          const list = document.getElementById('res-complaints-list');
          if (cData.complaints.length === 0) {
            list.innerHTML = `<div class="text-slate-400 text-xs py-4 text-center">No active complaints</div>`;
          } else {
            list.innerHTML = cData.complaints.slice(0, 3).map(c => `
              <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs flex justify-between items-center">
                <div>
                  <div class="font-bold text-slate-900">${c.title}</div>
                  <div class="text-[10px] text-slate-400 mt-0.5">${ui.formatDate(c.createdAt)}</div>
                </div>
                <div>${ui.getStatusBadge(c.status)}</div>
              </div>
            `).join('');
          }
        }
      } catch (e) {
        console.warn(e);
      }
    }
  </script>
</body>
</html>
