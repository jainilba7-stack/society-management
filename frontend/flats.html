<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flats Management - SocietyOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex">

  <div id="sidebar-container"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <div id="navbar-container"></div>

    <main class="p-6 md:p-8 space-y-6 max-w-7xl mx-auto w-full">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-2xl font-extrabold text-slate-900">Flats Directory</h2>
          <p class="text-xs text-slate-500">View and manage flats, occupancy status, and assigned residents.</p>
        </div>
        <div id="create-flat-btn-wrapper">
          <button onclick="document.getElementById('create-flat-modal').classList.remove('hidden')" class="btn-aqua text-xs py-2.5 px-4 flex items-center">
            <i class="lucide-plus-circle text-sm mr-1.5"></i> Add Flat
          </button>
        </div>
      </div>

      <!-- Filters & Search -->
      <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-wrap gap-3 items-center">
        <input type="text" id="filter-block" onkeyup="flatsModule.loadFlats()" placeholder="Filter by Block (e.g. A)" class="px-3 py-2 rounded-xl border border-slate-200 text-xs focus:outline-none">

        <select id="filter-occupancy" onchange="flatsModule.loadFlats()" class="px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold focus:outline-none">
          <option value="">All Occupancy Statuses</option>
          <option value="occupied">Occupied</option>
          <option value="vacant">Vacant</option>
          <option value="rented">Rented</option>
        </select>

        <input type="text" id="search-flat" onkeyup="flatsModule.loadFlats()" placeholder="Search flat number or owner..." class="px-3 py-2 rounded-xl border border-slate-200 text-xs focus:outline-none flex-1 min-w-[200px]">
      </div>

      <!-- Flats Table -->
      <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50/80 border-b border-slate-100 text-xs font-bold text-slate-500 uppercase tracking-wider">
                <th class="px-6 py-4">Flat Number</th>
                <th class="px-6 py-4">Block</th>
                <th class="px-6 py-4">Owner Name</th>
                <th class="px-6 py-4">Phone</th>
                <th class="px-6 py-4">Occupancy</th>
                <th class="px-6 py-4">Maintenance</th>
                <th class="px-6 py-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="flats-table-body">
              <tr><td colspan="7" class="p-8 text-center text-slate-400 text-sm">Loading flats...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create Flat Modal -->
  <div id="create-flat-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden p-4">
    <div class="bg-white rounded-3xl p-6 sm:p-8 w-full max-w-md modal-content space-y-4 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <h3 class="font-extrabold text-slate-900 text-lg">Add Flat</h3>
        <button onclick="document.getElementById('create-flat-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600"><i class="lucide-x text-lg"></i></button>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Block Name / Letter</label>
        <input type="text" id="create-flat-block" required placeholder="e.g. A or Block A" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-cyan-500">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Flat Number</label>
        <input type="text" id="create-flat-number" placeholder="e.g. A-105" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Owner Name</label>
        <input type="text" id="create-flat-owner" placeholder="Owner Full Name" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Phone</label>
        <input type="text" id="create-flat-phone" placeholder="+91 9876543210" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Email</label>
        <input type="email" id="create-flat-email" placeholder="owner@email.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
      </div>
      <div class="flex justify-end space-x-3 pt-2">
        <button onclick="document.getElementById('create-flat-modal').classList.add('hidden')" class="btn-aqua-outline text-xs">Cancel</button>
        <button onclick="flatsModule.createFlat()" class="btn-aqua text-xs">Add Flat</button>
      </div>
    </div>
  </div>

  <!-- Edit Flat Modal -->
  <div id="edit-flat-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden p-4">
    <div class="bg-white rounded-3xl p-6 sm:p-8 w-full max-w-md modal-content space-y-4 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <h3 class="font-extrabold text-slate-900 text-lg">Edit Flat <span id="edit-flat-number"></span></h3>
        <button onclick="document.getElementById('edit-flat-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600"><i class="lucide-x text-lg"></i></button>
      </div>
      <input type="hidden" id="edit-flat-id">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Owner Name</label>
        <input type="text" id="edit-flat-owner" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Phone</label>
        <input type="text" id="edit-flat-phone" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Email</label>
        <input type="email" id="edit-flat-email" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Occupancy Status</label>
        <select id="edit-flat-status" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
          <option value="occupied">Occupied</option>
          <option value="vacant">Vacant</option>
          <option value="rented">Rented</option>
        </select>
      </div>
      <div class="flex justify-end space-x-3 pt-2">
        <button onclick="document.getElementById('edit-flat-modal').classList.add('hidden')" class="btn-aqua-outline text-xs">Cancel</button>
        <button onclick="flatsModule.submitEditFlat()" class="btn-aqua text-xs">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/flats.js"></script>
  <script>
    lucide.createIcons();
    const user = auth.checkAuth(['admin', 'secretary', 'resident']);
    if (user) {
      if (user.role === 'resident') {
        const btn = document.getElementById('create-flat-btn-wrapper');
        if (btn) btn.style.display = 'none';
      }
      ui.initLayout('flats.html');
      flatsModule.init();
    }
  </script>
</body>
</html>
