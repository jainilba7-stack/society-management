<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Settings - SocietyOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex">

  <div id="sidebar-container"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <div id="navbar-container"></div>

    <main class="p-6 md:p-8 space-y-8 max-w-4xl mx-auto w-full">
      <div>
        <h2 class="text-2xl font-extrabold text-slate-900">Profile & Security Settings</h2>
        <p class="text-xs text-slate-500">Update your account information, change password, or log out.</p>
      </div>

      <!-- Account Summary Card -->
      <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-100 shadow-sm flex items-center justify-between">
        <div class="flex items-center space-x-6">
          <img id="prof-img" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" class="w-20 h-20 rounded-full object-cover border-4 border-cyan-400 shadow-md" alt="User Avatar">
          <div>
            <span id="prof-role" class="px-3 py-1 text-xs font-bold rounded-full bg-cyan-100 text-cyan-800 uppercase tracking-wider">RESIDENT</span>
            <div class="mt-2 text-xs text-slate-500 space-y-0.5 font-medium">
              <p>Block: <strong id="prof-block" class="text-slate-800">A</strong> | Flat: <strong id="prof-flat" class="text-slate-800">A-101</strong></p>
            </div>
          </div>
        </div>

        <button onclick="auth.logout()" class="px-5 py-2.5 bg-rose-50 text-rose-600 hover:bg-rose-100 border border-rose-200 font-bold text-xs rounded-xl flex items-center transition-all">
          <i class="lucide-log-out text-sm mr-2"></i> Log Out
        </button>
      </div>

      <!-- Form Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Personal Details -->
        <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
          <h3 class="font-extrabold text-slate-900 text-base">Personal Details</h3>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Full Name</label>
            <input type="text" id="prof-name" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-cyan-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Email (Read Only)</label>
            <input type="email" id="prof-email" disabled class="w-full px-4 py-2.5 rounded-xl border border-slate-100 bg-slate-50 text-sm text-slate-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Phone Number</label>
            <input type="text" id="prof-phone" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-cyan-500">
          </div>
          <button onclick="profileModule.updateProfile()" class="w-full btn-aqua text-xs py-2.5">Update Profile</button>
        </div>

        <!-- Security & Password -->
        <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
          <h3 class="font-extrabold text-slate-900 text-base">Change Password</h3>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Current Password</label>
            <input type="password" id="pass-current" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">New Password</label>
            <input type="password" id="pass-new" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Confirm New Password</label>
            <input type="password" id="pass-confirm" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
          </div>
          <button onclick="profileModule.changePassword()" class="w-full btn-aqua-outline text-xs py-2.5">Update Password</button>
        </div>
      </div>

      <!-- Session & Logout Section -->
      <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex items-center justify-between">
        <div>
          <h4 class="font-bold text-slate-900 text-sm">Account Session</h4>
          <p class="text-xs text-slate-500">Log out of your current session on this device.</p>
        </div>
        <button onclick="auth.logout()" class="px-6 py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs rounded-xl flex items-center transition-all shadow-md shadow-rose-100">
          <i class="lucide-log-out text-sm mr-2"></i> Log Out of Account
        </button>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
  <script>
    lucide.createIcons();
    const user = auth.checkAuth(['admin', 'secretary', 'resident']);
    if (user) {
      ui.initLayout('profile.html');
      profileModule.init();
    }
  </script>
</body>
</html>
