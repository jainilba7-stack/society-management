<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SocietyOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-3xl p-8 shadow-xl border border-slate-100 space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-aqua-gradient mx-auto flex items-center justify-center text-white font-extrabold text-2xl shadow-lg shadow-cyan-200">
        S
      </div>
      <h2 class="text-2xl font-extrabold text-slate-900">Resident Registration</h2>
      <p class="text-xs text-slate-500">Create your resident portal account</p>
    </div>

    <form id="register-form" class="space-y-4" onsubmit="handleRegister(event)">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">Full Name</label>
        <input type="text" id="reg-name" required placeholder="e.g. Jainil Shah" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-cyan-500">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">Email Address</label>
        <input type="email" id="reg-email" required placeholder="jainil@society.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-cyan-500">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Block Name / Letter</label>
          <input type="text" id="reg-block" required placeholder="e.g. A or Block A" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-cyan-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Flat Number</label>
          <input type="text" id="reg-flat" required placeholder="e.g. A-101" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-cyan-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">Phone Number</label>
        <input type="text" id="reg-phone" placeholder="+91 9876543210" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-cyan-500">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">Password</label>
        <input type="password" id="reg-password" required minlength="6" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-cyan-500">
      </div>

      <button type="submit" class="w-full btn-aqua py-3 text-sm flex items-center justify-center">
        Create Account <i class="lucide-user-plus text-base ml-2"></i>
      </button>
    </form>

    <div class="text-center text-xs text-slate-500 pt-2">
      Already registered? <a href="login.html" class="text-cyan-600 font-bold hover:underline">Sign In</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    lucide.createIcons();

    async function handleRegister(e) {
      e.preventDefault();
      const fullName = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const blockId = document.getElementById('reg-block').value;
      const flatNumber = document.getElementById('reg-flat').value;
      const phone = document.getElementById('reg-phone').value;
      const password = document.getElementById('reg-password').value;

      if (!fullName || !email || !password) {
        ui.showToast('Please fill all required fields: Name, Email, and Password', 'error');
        return;
      }

      await auth.register({ fullName, email, blockId, flatNumber, phone, password });
    }
  </script>
</body>
</html>
