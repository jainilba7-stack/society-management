<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements Board - SocietyOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex">

  <div id="sidebar-container"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <div id="navbar-container"></div>

    <main class="p-6 md:p-8 space-y-6 max-w-7xl mx-auto w-full">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-2xl font-extrabold text-slate-900">Announcements & Notices</h2>
          <p class="text-xs text-slate-500">Society-wide and block-specific notice board (Section 11, 33).</p>
        </div>
        <div id="create-announce-btn-wrapper">
          <button onclick="document.getElementById('create-announce-modal').classList.remove('hidden')" class="btn-aqua text-xs py-2.5 px-4 flex items-center">
            <i class="lucide-plus-circle text-sm mr-1.5"></i> Post Announcement
          </button>
        </div>
      </div>

      <!-- Announcement List Container -->
      <div id="announcements-container" class="space-y-4">
        <div class="p-8 text-center text-slate-400 text-sm">Loading announcements...</div>
      </div>
    </main>
  </div>

  <!-- Create Announcement Modal (Section 11) -->
  <div id="create-announce-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden p-4">
    <div class="bg-white rounded-3xl p-6 sm:p-8 w-full max-w-lg modal-content space-y-4 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <h3 class="font-extrabold text-slate-900 text-lg">Post Announcement</h3>
        <button onclick="document.getElementById('create-announce-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600"><i class="lucide-x text-lg"></i></button>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Announcement Title</label>
        <input type="text" id="announce-title" placeholder="e.g. Water Supply Interruption Notice" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div id="scope-select-group">
          <label class="block text-xs font-bold text-slate-700 mb-1">Target Scope</label>
          <select id="announce-scope" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
            <option value="society">Entire Society</option>
            <option value="block">Specific Block</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Priority</label>
          <select id="announce-priority" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
            <option value="normal">Normal</option>
            <option value="high">High Priority</option>
            <option value="urgent">Urgent Notice</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Description / Content</label>
        <textarea id="announce-desc" rows="4" placeholder="Full announcement details..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none"></textarea>
      </div>

      <div class="flex justify-end space-x-3 pt-2">
        <button onclick="document.getElementById('create-announce-modal').classList.add('hidden')" class="btn-aqua-outline text-xs">Cancel</button>
        <button onclick="announcementsModule.createAnnouncement()" class="btn-aqua text-xs">Post & Notify Residents</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/announcements.js"></script>
  <script>
    lucide.createIcons();
    const user = auth.checkAuth(['admin', 'secretary', 'resident']);
    if (user) {
      if (user.role === 'resident') {
        const btn = document.getElementById('create-announce-btn-wrapper');
        if (btn) btn.style.display = 'none';
      }
      if (user.role === 'secretary') {
        const scopeGrp = document.getElementById('scope-select-group');
        if (scopeGrp) scopeGrp.style.display = 'none';
      }
      ui.initLayout('announcements.html');
      announcementsModule.init();
    }
  </script>
</body>
</html>
