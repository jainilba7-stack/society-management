<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance Bills & Payments - SocietyOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex">

  <div id="sidebar-container"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <div id="navbar-container"></div>

    <main class="p-6 md:p-8 space-y-8 max-w-7xl mx-auto w-full">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-2xl font-extrabold text-slate-900">Maintenance & Bills</h2>
          <p class="text-xs text-slate-500">Monthly society maintenance bills, Razorpay payment processing, and receipts.</p>
        </div>
        <div id="create-bill-btn-wrapper">
          <button onclick="document.getElementById('create-bill-modal').classList.remove('hidden')" class="btn-aqua text-xs py-2.5 px-4 flex items-center">
            <i class="lucide-plus-circle text-sm mr-1.5"></i> Create Monthly Bill
          </button>
        </div>
      </div>

      <!-- Active Maintenance Bills -->
      <div class="space-y-3">
        <h3 class="font-extrabold text-slate-900 text-base">Issued Monthly Bills</h3>
        <div id="bills-list" class="space-y-3"></div>
      </div>

      <!-- Payment History & Status Table -->
      <div class="space-y-4">
        <h3 class="font-extrabold text-slate-900 text-base">Payment History & Tracking</h3>
        <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-50/80 border-b border-slate-100 text-xs font-bold text-slate-500 uppercase tracking-wider">
                  <th class="px-6 py-4">Bill Month</th>
                  <th class="px-6 py-4">Resident</th>
                  <th class="px-6 py-4">Block / Flat</th>
                  <th class="px-6 py-4">Amount</th>
                  <th class="px-6 py-4">Status</th>
                  <th class="px-6 py-4">Txn ID</th>
                  <th class="px-6 py-4 text-right">Action</th>
                </tr>
              </thead>
              <tbody id="payments-table-body">
                <tr><td colspan="7" class="p-8 text-center text-slate-400 text-sm">Loading payment records...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Create Maintenance Bill Modal (Section 9) -->
  <div id="create-bill-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden p-4">
    <div class="bg-white rounded-3xl p-6 sm:p-8 w-full max-w-md modal-content space-y-4 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <h3 class="font-extrabold text-slate-900 text-lg">Create Monthly Maintenance Bill</h3>
        <button onclick="document.getElementById('create-bill-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600"><i class="lucide-x text-lg"></i></button>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Target Flat Number (Optional)</label>
        <input type="text" id="bill-flatnumber" placeholder="e.g. A-101 (Leave empty for all society flats)" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Month</label>
          <select id="bill-month" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
            <option value="October">October</option>
            <option value="November">November</option>
            <option value="December">December</option>
            <option value="January">January</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Year</label>
          <input type="number" id="bill-year" value="2026" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Amount (₹)</label>
          <input type="number" id="bill-amount" value="2500" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Late Fee (₹)</label>
          <input type="number" id="bill-latefee" value="100" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Due Date</label>
        <input type="date" id="bill-duedate" value="2026-10-10" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Bill Copy / Image Proof (Optional)</label>
        <input type="file" id="bill-image" accept="image/*,.pdf" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs text-slate-600 focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Description</label>
        <input type="text" id="bill-desc" value="Monthly Maintenance Charge" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
      </div>

      <div class="flex justify-end space-x-3 pt-2">
        <button onclick="document.getElementById('create-bill-modal').classList.add('hidden')" class="btn-aqua-outline text-xs">Cancel</button>
        <button onclick="maintenanceModule.createBill()" class="btn-aqua text-xs">Issue Maintenance Bill</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/maintenance.js"></script>
  <script>
    lucide.createIcons();
    const user = auth.checkAuth(['admin', 'secretary', 'resident']);
    if (user) {
      if (user.role !== 'admin') {
        const btn = document.getElementById('create-bill-btn-wrapper');
        if (btn) btn.style.display = 'none';
      }
      ui.initLayout('maintenance.html');
      maintenanceModule.init();
    }
  </script>
</body>
</html>
