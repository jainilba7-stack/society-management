<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electricity & Light Bills - SocietyOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex">

  <div id="sidebar-container"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <div id="navbar-container"></div>

    <main class="p-6 md:p-8 space-y-6 max-w-7xl mx-auto w-full">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-2xl font-extrabold text-slate-900">Electricity & Light Bills</h2>
          <p class="text-xs text-slate-500">Track common area & block electricity bills (Section 10).</p>
        </div>
        <div id="create-elec-btn-wrapper">
          <button onclick="document.getElementById('create-elec-modal').classList.remove('hidden')" class="btn-aqua text-xs py-2.5 px-4 flex items-center">
            <i class="lucide-plus-circle text-sm mr-1.5"></i> Add Electricity Bill
          </button>
        </div>
      </div>

      <!-- Filters -->
      <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-3">
        <input type="text" id="filter-block" onkeyup="electricityModule.loadElectricityBills()" placeholder="Filter by Block (e.g. A)" class="px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold focus:outline-none">
      </div>

      <!-- Table -->
      <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50/80 border-b border-slate-100 text-xs font-bold text-slate-500 uppercase tracking-wider">
                <th class="px-6 py-4">Bill Month</th>
                <th class="px-6 py-4">Block</th>
                <th class="px-6 py-4">Amount</th>
                <th class="px-6 py-4">Due Date</th>
                <th class="px-6 py-4">Status</th>
                <th class="px-6 py-4 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="electricity-table-body">
              <tr><td colspan="6" class="p-8 text-center text-slate-400 text-sm">Loading electricity bills...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create Electricity Bill Modal (Section 10) -->
  <div id="create-elec-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden p-4">
    <div class="bg-white rounded-3xl p-6 sm:p-8 w-full max-w-md modal-content space-y-4 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <h3 class="font-extrabold text-slate-900 text-lg">Add Electricity Bill</h3>
        <button onclick="document.getElementById('create-elec-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600"><i class="lucide-x text-lg"></i></button>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Month</label>
          <select id="elec-month" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
            <option value="October">October</option>
            <option value="November">November</option>
            <option value="December">December</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Year</label>
          <input type="number" id="elec-year" value="2026" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Block Name / Letter</label>
        <input type="text" id="create-bill-block" required placeholder="e.g. A or Block A" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Bill Amount (₹)</label>
        <input type="number" id="elec-amount" placeholder="e.g. 5200" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Due Date</label>
        <input type="date" id="elec-duedate" value="2026-10-15" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Description</label>
        <input type="text" id="elec-desc" value="Common area lighting & lift bill" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
      </div>

      <div class="flex justify-end space-x-3 pt-2">
        <button onclick="document.getElementById('create-elec-modal').classList.add('hidden')" class="btn-aqua-outline text-xs">Cancel</button>
        <button onclick="electricityModule.createBill()" class="btn-aqua text-xs">Save Electricity Bill</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/electricity.js"></script>
  <script>
    lucide.createIcons();
    const user = auth.checkAuth(['admin', 'secretary', 'resident']);
    if (user) {
      if (user.role === 'resident') {
        const btn = document.getElementById('create-elec-btn-wrapper');
        if (btn) btn.style.display = 'none';
      }
      ui.initLayout('electricity.html');
      electricityModule.init();
    }
  </script>
</body>
</html>
