<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - SocietyOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-3xl p-8 shadow-xl border border-slate-100 space-y-6">
    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-aqua-gradient mx-auto flex items-center justify-center text-white font-extrabold text-2xl shadow-lg shadow-cyan-200">
        S
      </div>
      <h2 class="text-2xl font-extrabold text-slate-900">Sign In to SocietyOS</h2>
      <p class="text-xs text-slate-500">Access your residential portal</p>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">Email Address</label>
        <input type="email" id="email" required placeholder="name@society.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-cyan-500 transition-colors">
      </div>

      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="block text-xs font-bold text-slate-700">Password</label>
          <a href="#" onclick="alert('Demo reset link sent to your registered email')" class="text-xs text-cyan-600 font-semibold hover:underline">Forgot password?</a>
        </div>
        <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-cyan-500 transition-colors">
      </div>

      <button type="submit" class="w-full btn-aqua py-3 text-sm flex items-center justify-center">
        Sign In <i class="lucide-arrow-right text-base ml-2"></i>
      </button>
    </form>

    <!-- Scalable Dynamic Role Quick-Select (Supports Blocks A to Z) -->
    <div class="pt-4 border-t border-slate-100 space-y-3">
      <p class="text-xs font-bold text-slate-500 text-center uppercase tracking-wider">⚡ Scalable Quick Demo Login</p>
      
      <div class="grid grid-cols-3 gap-2 text-xs font-semibold">
        <button onclick="fillRole('admin')" class="py-2.5 px-2 bg-slate-50 hover:bg-cyan-50 hover:text-cyan-700 border border-slate-200 rounded-xl transition-all text-center">
          👑 Main Sec
        </button>
        <button onclick="fillRole('secretary')" class="py-2.5 px-2 bg-slate-50 hover:bg-cyan-50 hover:text-cyan-700 border border-slate-200 rounded-xl transition-all text-center">
          🏢 Block Sec
        </button>
        <button onclick="fillRole('resident')" class="py-2.5 px-2 bg-slate-50 hover:bg-cyan-50 hover:text-cyan-700 border border-slate-200 rounded-xl transition-all text-center">
          👤 Resident
        </button>
      </div>

      <!-- Dynamic Block selector for Block Secretaries (A to Z) -->
      <div id="block-sec-picker" class="hidden bg-cyan-50/60 p-3 rounded-2xl border border-cyan-200 space-y-2 text-xs">
        <label class="block font-bold text-cyan-900">Enter Any Block Letter (A-Z):</label>
        <div class="flex gap-2">
          <input type="text" id="sec-block-input" placeholder="e.g. A, B, C... Z" value="A" class="px-3 py-1.5 rounded-xl border border-slate-200 font-bold uppercase text-center w-24 text-sm focus:outline-none">
          <button onclick="loginAsBlockSecretary()" class="btn-aqua py-1.5 px-4 text-xs flex-1">Login as Block Sec</button>
        </div>
      </div>
    </div>

    <div class="text-center text-xs text-slate-500 pt-2">
      New resident? <a href="register.html" class="text-cyan-600 font-bold hover:underline">Register Account</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    lucide.createIcons();

    // Auto-redirect if already logged in (persistent session)
    if (api.getToken() && api.getUser()) {
      const user = api.getUser();
      auth.redirectToDashboard(user.role);
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.login(email, password);
    }

    function fillRole(role) {
      const picker = document.getElementById('block-sec-picker');
      if (role === 'admin') {
        picker.classList.add('hidden');
        document.getElementById('email').value = 'admin@society.com';
        document.getElementById('password').value = 'Admin@123';
        auth.login('admin@society.com', 'Admin@123');
      } else if (role === 'resident') {
        picker.classList.add('hidden');
        document.getElementById('email').value = 'jainil@society.com';
        document.getElementById('password').value = 'Resident@123';
        auth.login('jainil@society.com', 'Resident@123');
      } else if (role === 'secretary') {
        picker.classList.remove('hidden');
      }
    }

    function loginAsBlockSecretary() {
      const letter = (document.getElementById('sec-block-input').value || 'A').trim().toLowerCase();
      const email = `sec.block${letter}@society.com`;
      document.getElementById('email').value = email;
      document.getElementById('password').value = 'Sec@123';
      auth.login(email, 'Sec@123');
    }
  </script>
</body>
</html>
